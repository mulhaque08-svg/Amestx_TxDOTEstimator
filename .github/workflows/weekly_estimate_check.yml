name: Weekly TxDOT Estimate Audit & Live Sync

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-estimates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run TxDOT Estimate Live Sync & Audit
        run: |
          python backend/sync_live_estimates.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-sync live TxDOT letting estimates from Tableau"
          git push origin main || echo "No changes to push"
