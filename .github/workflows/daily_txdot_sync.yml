name: Daily TxDOT Schedules, Dates & Estimates Auto-Sync

on:
  schedule:
    # Runs every single day at 11:00 UTC (6:00 AM Central Time)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-txdot-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run TxDOT Live Schedule & Date Sync
        run: |
          python backend/sync_live_txdot_schedules.py

      - name: Run TxDOT Estimate Audit
        run: |
          python backend/sync_live_estimates.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "Auto-sync: Daily TxDOT letting schedules, dates & estimates updated" && git push origin main) || echo "No changes to push"
